[project]
name = "hobbyjogging-import"
version = "0.1.0"
description = "Import and normalize training data from external sources"
requires-python = ">=3.14"
dependencies = [
    "hobbyjogging-core",
]

[tool.uv.sources]
hobbyjogging-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hobbyjogging_import"]
