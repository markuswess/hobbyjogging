[project]
name = "hobbyjogging-reports"
version = "0.1.0"
description = "Training reports, analysis, and charts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "hobbyjogging-core",
    # kaleido 0.2.x bundles its Chromium; kaleido 1.x needs system Chrome.
    "kaleido==0.2.1",
    "markdown>=3.7",
    "plotly>=6.0,<7",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hobbyjogging_report"]
