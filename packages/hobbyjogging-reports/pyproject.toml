[project]
name = "hobbyjogging-reports"
version = "0.1.0"
description = "Training reports, analysis, and charts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "hobbyjogging-core",
    "matplotlib>=3.10",
    "plotly>=6.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hobbyjogging_report"]
