[project]
name = "hobbyjogging-maintenance"
version = "0.1.0"
description = "Schema evolution and data maintenance for the training database"
requires-python = ">=3.14"
dependencies = [
    "hobbyjogging-core",
    "hobbyjogging-import",
    "hobbyjogging-reports",
]

[project.scripts]
hobbyjogging-maintenance = "hobbyjogging_maintenance.cli:main"

[tool.uv.sources]
hobbyjogging-core = { workspace = true }
hobbyjogging-import = { workspace = true }
hobbyjogging-reports = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hobbyjogging_maintenance"]
