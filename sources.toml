# Per-athlete import policy. Capability lives in code; this file is the
# athlete's choice. Credentials stay in .env.
#
# Path: ./sources.toml (or HOBBYJOGGING_SOURCES). A missing file means the code
# defaults: every source enabled, and create when nothing matches.
#
# A source enabled here but missing its credential is skipped by ./sync.sh with
# a warning, never a failed sync. The Strava export is the newest unimported
# export_*.zip in data/strava (or $HOBBYJOGGING_STRAVA_DIR).
#
# Keys per source:
#   enabled      true | false
#   create       create | review | ignore   (Strava and Runalyze)
#   title        social | name              (where a title goes)
#   description  social | description       (where a description goes)
#   <capability> true | false               (Runalyze/Garmin, default true)
#
# Capability keys:
#   [sources.runalyze]  tags, gear, races, vo2max, workout_type, trimp
#   [sources.garmin]    wellness
#
# A capability switch selects a step; it never changes field precedence. The
# four axes are capability (the source profile), selection (this file),
# precedence (owner-based plus ranked authority in code) and review (the
# queue).
#
# FIT, Intervals and the sheet always create when nothing matches; use
# enabled to leave one out. Garmin yields files, not activity rows.

[sources.fit]
enabled = true

[sources.intervals]
enabled = true

[sources.garmin]
enabled = true
wellness = true

[sources.runalyze]
create = "review"
tags = true
gear = true
races = true
vo2max = true
workout_type = true
trimp = true

[sources.strava]
create = "ignore"
title = "social"
description = "social"

[sources.sheet]
enabled = false
