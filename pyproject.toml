[project]
name = "hobbyjogging"
version = "0.1.0"
description = "Training data, imports, and reports"
requires-python = ">=3.14"
dependencies = [
    "hobbyjogging-core",
    "hobbyjogging-import",
    "hobbyjogging-reports",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
hobbyjogging-core = { workspace = true }
hobbyjogging-import = { workspace = true }
hobbyjogging-reports = { workspace = true }
